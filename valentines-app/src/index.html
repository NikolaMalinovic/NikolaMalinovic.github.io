<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="card" id="card">
      <h1><span id="name">Someone</span>, will you be my Valentine?</h1>
      <p class="sub">Choose carefully 💌</p>

      <div class="button-area" id="area">
        <button id="yes" class="btn btn-yes" aria-label="Yes">Yes</button>
        <button id="no" class="btn btn-no" aria-label="No">No</button>
      </div>
    </div>

    <div id="celebrate" class="celebrate hidden" role="dialog" aria-hidden="true">
      <div class="celebrate-card">
        <div class="hearts" aria-hidden="true"></div>
        <h2>Yay — best decision ever!</h2>
        <p class="big">I love you 💖</p>
        <button id="restart" class="btn">Back</button>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
